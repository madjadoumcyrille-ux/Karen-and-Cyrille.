<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Love Challenge ❤️</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#ff5f7e,#ff9a9e);min-height:100vh;color:white;padding:18px}.wrap{max-width:560px;margin:auto}.box{background:#ffffff2b;padding:22px;border-radius:28px;box-shadow:0 15px 40px #0003;text-align:center}.card{background:white;color:#222;border-radius:22px;padding:24px;margin-top:18px}.q{font-size:24px;font-weight:bold;margin:20px 0}button{border:0;border-radius:14px;padding:14px 18px;margin:6px;font-weight:bold;font-size:16px;background:#ff477e;color:white}button.soft{background:#ffe3eb;color:#d62d5c}input{padding:14px;width:90%;border:1px solid #ddd;border-radius:12px;font-size:17px}.score{display:flex;justify-content:space-between;background:#0003;padding:12px;border-radius:14px}.code{font-size:30px;font-weight:bold;letter-spacing:5px;color:#e83263}.hidden{display:none}.small{color:#666;line-height:1.5}
</style></head><body><div class="wrap"><div class="box"><h1>❤️ Love Challenge</h1><p>Jouez ensemble, même à distance 💕</p>
<div id="home" class="card"><h2>👫 Multijoueur</h2><button onclick="create()">Créer une partie</button><button class="soft" onclick="joinForm()">Rejoindre une partie</button></div>
<div id="join" class="card hidden"><h2>🔑 Code de partie</h2><input id="code" placeholder="Ex: LOVE482"><br><button onclick="join()">Rejoindre ❤️</button><button class="soft" onclick="back()">Retour</button><p id="msg" class="small"></p></div>
<div id="lobby" class="card hidden"><h2>💞 En attente</h2><p>Envoie ce code à ta copine :</p><div id="room" class="code"></div><button class="soft" onclick="copy()">📋 Copier</button><p id="ls" class="small">En attente du deuxième joueur…</p></div>
<div id="play" class="hidden"><div class="score"><span>👤 Joueur 1: <b id="a">0</b></span><span>👤 Joueur 2: <b id="b">0</b></span></div><p id="st"></p><div class="card"><div id="cat"></div><div id="q" class="q"></div><div id="actions"></div><p id="wait" class="small"></p></div><button id="next" onclick="next()" class="soft hidden">🎲 Question suivante</button></div>
<div id="end" class="card hidden"><h2>🏆 Partie terminée</h2><p id="result"></p><button onclick="location.reload()">Rejouer 🔄</button></div>
</div></div>
<script>
const qs=[["💕 ROMANTIQUE","Quelle est la première chose que tu as remarquée chez moi ?"],["💕 ROMANTIQUE","Donne-moi 3 choses que tu aimes chez moi."],["💕 ROMANTIQUE","Quel est ton souvenir préféré avec moi ?"],["💕 ROMANTIQUE","Quelle chanson te fait penser à moi ?"],["💕 ROMANTIQUE","Décris notre rendez-vous parfait."],["🥰 COMPLICITÉ","Quelle petite chose que je fais te fait sourire ?"],["🥰 COMPLICITÉ","Quel voyage aimerais-tu faire avec moi ?"],["😏 TAQUIN","Qui est le plus jaloux ? 😂"],["😏 TAQUIN","Qui est tombé amoureux en premier ?"],["😏 TAQUIN","Qu’est-ce qui te fait le plus craquer chez moi ?"],["❤️ DÉFI","Fais une mini déclaration d’amour de 20 secondes."],["❤️ DÉFI","Fais-moi rire en 20 secondes."],["❤️ DÉFI","Dis « je t’aime » avec ta voix la plus drôle."],["🔮 FUTUR","Où aimerais-tu qu’on soit dans 5 ans ?"],["🔮 FUTUR","Quel rêve aimerais-tu réaliser avec moi ?"],["🔮 FUTUR","Si on pouvait partir demain, où irions-nous ?"],["💋 BONUS","Choisis : bisou 😘 ou câlin 🤗"],["💋 BONUS","Choisis une activité à faire ensemble ce week-end."],["🏆 FINAL","Pourquoi veux-tu continuer cette histoire avec moi ? ❤️"]];
let peer,conn,host=false,me=0,room="",s={score:[0,0],qi:0,done:[false,false],used:[]};
const $=x=>document.getElementById(x), show=x=>$(x).classList.remove("hidden"), hide=x=>$(x).classList.add("hidden");
function joinForm(){hide("home");show("join")} function back(){hide("join");show("home")}
function create(){host=true;me=0;room=Math.random().toString(36).slice(2,8).toUpperCase();peer=new Peer("love-"+room);peer.on("open",()=>{$("room").textContent=room;hide("home");show("lobby")});peer.on("connection",c=>{conn=c;wire()})}
function join(){room=$("code").value.trim().toUpperCase();if(!room)return;$("msg").textContent="Connexion…";peer=new Peer();peer.on("open",()=>{me=1;conn=peer.connect("love-"+room);wire()});peer.on("error",()=>$("msg").textContent="Code incorrect ou partie indisponible.")}
function wire(){conn.on("open",()=>{if(host){start();send({t:"state",s:s})}else send({t:"hello"})});conn.on("data",m=>{if(m.t=="hello"&&host)send({t:"state",s:s});if(m.t=="state"){s=m.s;hide("lobby");show("play");render()}if(m.t=="answer"){s.done[m.p]=true;s.score[m.p]++;render();if(host)send({t:"state",s:s})}if(m.t=="next"){s=m.s;render()}})}
function send(x){if(conn&&conn.open)conn.send(x)}
function pick(){if(s.used.length>=qs.length)return -1;let i;do{i=Math.floor(Math.random()*qs.length)}while(s.used.includes(i));s.used.push(i);return i}
function start(){s.qi=pick();s.done=[false,false];hide("lobby");show("play");render()}
function render(){if(s.qi<0){finish();return}$("a").textContent=s.score[0];$("b").textContent=s.score[1];$("cat").textContent=qs[s.qi][0];$("q").textContent=qs[s.qi][1];$("st").textContent=`Tu es Joueur ${me+1}`;$("actions").innerHTML="";$("next").classList.add("hidden");if(!s.done[me]){let b=document.createElement("button");b.textContent="✅ J’ai répondu / fait le défi (+1)";b.onclick=answer;$("actions").appendChild(b);$("wait").textContent="Quand tu as terminé, appuie sur le bouton."}else $("wait").textContent="⏳ Tu as répondu. Attends l’autre joueur…";if(host&&s.done[0]&&s.done[1])$("next").classList.remove("hidden")}
function answer(){if(s.done[me])return;s.done[me]=true;s.score[me]++;send({t:"answer",p:me});render()}
function next(){if(!host||!s.done[0]||!s.done[1])return;s.qi=pick();s.done=[false,false];send({t:"next",s:s});render()}
function finish(){hide("play");show("end");let x=s.score[0],y=s.score[1];$("result").innerHTML=(x>y?"Joueur 1 gagne 🏆❤️":y>x?"Joueur 2 gagne 🏆❤️":"Égalité parfaite 💕")+"<br><br>Score : "+x+" – "+y+"<br><br>Le vrai gagnant : votre amour 😍"}
function copy(){navigator.clipboard?.writeText(room);$("ls").textContent="Code copié ❤️"}
</script></body></html>
